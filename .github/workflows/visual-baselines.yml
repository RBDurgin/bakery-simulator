name: Visual baselines

# Takes new baseline screenshots for e2e/visual.spec.ts and commits them to
# the branch. Baselines must come from this system, because fonts and emoji
# differ between machines. Start it by hand from the Actions tab, or put
# [visual-baselines] in a commit message.
on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main

permissions:
  contents: write

concurrency:
  group: visual-baselines-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    name: Update screenshots
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[visual-baselines]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Take new screenshots
        run: npm run e2e:visual -- --update-snapshots
      - name: Check that the new screenshots are steady
        run: npm run e2e:visual
      - name: Commit the screenshots
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/__screenshots__
          if git diff --cached --quiet; then
            echo "The screenshots have not changed."
          else
            git commit -m "Update visual baselines"
            git push origin "HEAD:$BRANCH"
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
